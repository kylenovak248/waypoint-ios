name: Waypoint
options:
  bundleIdPrefix: com.kylenovak
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  Waypoint:
    type: application
    platform: iOS
    sources:
      - path: Waypoint
        excludes:
          - "**/*.md"
    resources:
      - Waypoint/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kylenovak.waypoint
        PRODUCT_NAME: Waypoint
        INFOPLIST_FILE: Waypoint/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_OBJC_BRIDGING_HEADER: Waypoint/Device/Waypoint-Bridging-Header.h
        HEADER_SEARCH_PATHS: $(PROJECT_DIR)/Vendor/idevice
        LIBRARY_SEARCH_PATHS: $(PROJECT_DIR)/Vendor/idevice
        OTHER_LDFLAGS: -lidevice_ffi
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_BITCODE: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        GCC_C_LANGUAGE_STANDARD: gnu11
    dependencies:
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
      - sdk: libresolv.tbd
